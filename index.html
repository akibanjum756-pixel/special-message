<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire UID Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#5b0b18,#160308 55%,#050105);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:35px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input,
select{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:15px;
}

select{
    margin-top:12px;
}

option{
    background:#1b0710;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ff1744,#ff5722);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(255,23,68,.35);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.loader{
    display:none;
    text-align:center;
    margin:25px 0;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:#ff1744;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,0,60,.12);
    border:1px solid rgba(255,0,60,.4);
    color:#ff8da5;
    text-align:center;
}

.profile{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    animation:fade .5s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    background:
        linear-gradient(135deg,#ff1744,#ff9800);

    box-shadow:
        0 0 30px rgba(255,23,68,.4);
}

.player-name{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:12px;
    word-break:break-word;
}

.uid{
    text-align:center;
    color:#aaa;
    margin-top:5px;
}

.region{
    text-align:center;
    margin-top:7px;
    color:#ff8095;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.stat{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
}

.stat span{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:5px;
}

.stat strong{
    font-size:16px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>


<body>

<div class="container">

    <div class="logo">
        🔥 FREE FIRE
    </div>

    <div class="subtitle">
        UID Player Information
    </div>


    <!-- UID -->

    <input
        type="text"
        id="uid"
        placeholder="Enter Free Fire UID"
        inputmode="numeric"
    >


    <!-- REGION -->

    <select id="region">

        <option value="BD">
            🇧🇩 Bangladesh
        </option>

        <option value="IND">
            🇮🇳 India
        </option>

        <option value="SG">
            🇸🇬 Singapore
        </option>

        <option value="BR">
            🇧🇷 Brazil
        </option>

        <option value="US">
            🇺🇸 USA
        </option>

        <option value="PK">
            🇵🇰 Pakistan
        </option>

        <option value="ME">
            🌍 Middle East
        </option>

    </select>


    <!-- SEARCH -->

    <button
        id="searchBtn"
        onclick="searchPlayer()"
    >
        🔍 Search Player
    </button>


    <!-- LOADING -->

    <div
        class="loader"
        id="loader"
    >

        <div class="spinner"></div>

        <p style="margin-top:10px;">
            Searching player...
        </p>

    </div>


    <!-- ERROR -->

    <div
        class="error"
        id="error"
    ></div>


    <!-- PROFILE -->

    <div
        class="profile"
        id="profile"
    >

        <div class="avatar">
            👤
        </div>


        <div
            class="player-name"
            id="playerName"
        >
            Player Name
        </div>


        <div
            class="uid"
            id="playerUID"
        >
            UID: -
        </div>


        <div
            class="region"
            id="playerRegion"
        >
            Region: -
        </div>


        <div class="stats">

            <div class="stat">

                <span>
                    LEVEL
                </span>

                <strong id="level">
                    -
                </strong>

            </div>


            <div class="stat">

                <span>
                    BR RANK
                </span>

                <strong id="rank">
                    -
                </strong>

            </div>


            <div class="stat">

                <span>
                    LIKES
                </span>

                <strong id="likes">
                    -
                </strong>

            </div>


            <div class="stat">

                <span>
                    CS RANK
                </span>

                <strong id="csrank">
                    -
                </strong>

            </div>


            <div class="stat">

                <span>
                    BR POINTS
                </span>

                <strong id="brpoints">
                    -
                </strong>

            </div>


            <div class="stat">

                <span>
                    CS POINTS
                </span>

                <strong id="cspoints">
                    -
                </strong>

            </div>

        </div>

    </div>


    <div class="footer">
        Free Fire UID Checker • Unofficial API
    </div>

</div>



<script>

/*
====================================================
FREE FIRE API
====================================================
*/

const API_URL =
"https://free-ff-api-src-5plp.onrender.com/api/v1/account";



/*
====================================================
SEARCH PLAYER
====================================================
*/

async function searchPlayer(){

    const uid =
        document
        .getElementById("uid")
        .value
        .trim();


    const region =
        document
        .getElementById("region")
        .value;


    const loader =
        document
        .getElementById("loader");


    const profile =
        document
        .getElementById("profile");


    const errorBox =
        document
        .getElementById("error");


    const button =
        document
        .getElementById("searchBtn");


    /*
    Reset
    */

    profile.style.display =
        "none";

    errorBox.style.display =
        "none";


    /*
    UID validation
    */

    if(!uid){

        showError(
            "Please enter a Free Fire UID."
        );

        return;
    }


    if(!/^\d+$/.test(uid)){

        showError(
            "UID must contain numbers only."
        );

        return;
    }


    if(uid.length < 6){

        showError(
            "Please enter a valid UID."
        );

        return;
    }


    /*
    Loading
    */

    loader.style.display =
        "block";

    button.disabled =
        true;

    button.innerText =
        "⏳ Searching...";


    try{

        /*
        Create API URL

        Example:

        ?region=BD&uid=123456789
        */

        const url =
            API_URL +
            "?region=" +
            encodeURIComponent(region) +
            "&uid=" +
            encodeURIComponent(uid);


        console.log(
            "API REQUEST:",
            url
        );


        /*
        API request
        */

        const response =
            await fetch(url);


        console.log(
            "HTTP STATUS:",
            response.status
        );


        /*
        HTTP error
        */

        if(!response.ok){

            let message =
                "API Error " +
                response.status;

            try{

                const errorData =
                    await response.json();

                if(errorData.message){

                    message =
                        errorData.message;
                }

            }catch(e){}

            throw new Error(message);
        }


        /*
        Convert response to JSON
        */

        const result =
            await response.json();


        console.log(
            "API RESPONSE:",
            result
        );


        /*
        API response:

        {
            basicInfo:{
                accountId,
                nickname,
                region,
                level,
                rank,
                rankingPoints,
                liked,
                csRank,
                csRankingPoints
            }
        }
        */


        const data =
            result.basicInfo ||
            result.basicinfo ||
            result.data?.basicInfo ||
            result.data?.basicinfo;


        /*
        No player
        */

        if(!data){

            throw new Error(
                "Player not found."
            );
        }


        /*
        NAME
        */

        document
        .getElementById("playerName")
        .innerText =
            data.nickname ||
            "Unknown Player";


        /*
        UID
        */

        document
        .getElementById("playerUID")
        .innerText =
            "UID: " +
            (
                data.accountId ||
                data.accountid ||
                uid
            );


        /*
        REGION
        */

        document
        .getElementById("playerRegion")
        .innerText =
            "Region: " +
            (
                data.region ||
                region
            );


        /*
        LEVEL
        */

        document
        .getElementById("level")
        .innerText =
            data.level ??
            "-";


        /*
        BR RANK
        */

        document
        .getElementById("rank")
        .innerText =
            data.rank ??
            "-";


        /*
        LIKES
        */

        document
        .getElementById("likes")
        .innerText =
            formatNumber(
                data.liked
            );


        /*
        CS RANK
        */

        document
        .getElementById("csrank")
        .innerText =
            data.csRank ??
            data.csrank ??
            "-";


        /*
        BR RANKING POINTS
        */

        document
        .getElementById("brpoints")
        .innerText =
            formatNumber(
                data.rankingPoints ??
                data.rankingpoints
            );


        /*
        CS RANKING POINTS
        */

        document
        .getElementById("cspoints")
        .innerText =
            formatNumber(
                data.csRankingPoints ??
                data.csrankingpoints
            );


        /*
        Show profile
        */

        profile.style.display =
            "block";


    }catch(error){

        console.error(
            "FREE FIRE API ERROR:",
            error
        );


        showError(
            "⚠️ " +
            error.message
        );


    }finally{

        /*
        Stop loading
        */

        loader.style.display =
            "none";


        button.disabled =
            false;


        button.innerText =
            "🔍 Search Player";
    }

}



/*
====================================================
FORMAT NUMBER
====================================================
*/

function formatNumber(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "-";
    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value;
    }


    return number.toLocaleString();
}



/*
====================================================
ERROR MESSAGE
====================================================
*/

function showError(message){

    const errorBox =
        document
        .getElementById("error");


    errorBox.innerText =
        message;


    errorBox.style.display =
        "block";
}



/*
====================================================
ENTER KEY SEARCH
====================================================
*/

document
.getElementById("uid")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchPlayer();

        }

    }
);

</script>

</body>
</html>
