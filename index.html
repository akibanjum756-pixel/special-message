```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire UID Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#5b0b18,#160308 55%,#050105);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:35px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:15px;
}

select{
    margin-top:12px;
}

option{
    background:#1b0710;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ff1744,#ff5722);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(255,23,68,.35);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

    display:none;
    text-align:center;
    margin:25px 0;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:#ff1744;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

    to{transform:rotate(360deg)}

    display:none;
    margin-top:20px;

        opacity:0;

<body>

<div class="container">

    <div class="logo">🔥 FREE FIRE</div>

    <div class="subtitle">
        UID Player Information
    </div>

    <input
        type="text"
        id="uid"
        placeholder="Enter Free Fire UID"
        inputmode="numeric"
    >

    <select id="region">
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="IND">🇮🇳 India</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="US">🇺🇸 USA</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="ME">🌍 Middle East</option>
    </select>

    <button id="searchBtn" onclick="searchPlayer()">
        🔍 Search Player
    </button>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="margin-top:10px;">
            Searching player...
        </p>
    </div>

    <div class="error" id="error"></div>

    <div class="profile" id="profile">

        <div class="avatar">
            👤
        </div>

        <div class="player-name" id="playerName">
            Player Name
        </div>

        <div class="uid" id="playerUID">
            UID: -
        </div>

        <div class="region" id="playerRegion">
            Region: -
        </div>

        <div class="stats">

            <div class="stat">
                <span>LEVEL</span>
                <strong id="level">-</strong>
            </div>

            <div class="stat">
                <span>BR RANK</span>
                <strong id="rank">-</strong>
            </div>

            <div class="stat">
                <span>LIKES</span>
                <strong id="likes">-</strong>
            </div>

            <div class="stat">
                <span>CS RANK</span>
                <strong id="csrank">-</strong>
            </div>

            <div class="stat">
                <span>BR POINTS</span>
                <strong id="brpoints">-</strong>
            </div>

            <div class="stat">
                <span>CS POINTS</span>
                <strong id="cspoints">-</strong>
            </div>

        </div>

    </div>

    <div class="footer">
        Free Fire UID Checker • Unofficial API
    </div>

</div>


<script>

const API_URL =
"https://freefireinfo-zy9l.onrender.com/api/v1/player-profile";


async function searchPlayer(){

    const uid =
        document.getElementById("uid").value.trim();

    const server =
        document.getElementById("region").value;

    const loader =
        document.getElementById("loader");

    const profile =
        document.getElementById("profile");

    const errorBox =
        document.getElementById("error");

    const button =
        document.getElementById("searchBtn");


    /* Reset */

    profile.style.display = "none";
    errorBox.style.display = "none";


    /* UID validation */

    if(!uid){

        showError("Please enter a Free Fire UID.");

        return;
    }


    if(!/^\d+$/.test(uid)){

        showError("UID must contain numbers only.");

        return;
    }


    if(uid.length < 6){

        showError("Please enter a valid Free Fire UID.");

        return;
    }


    /* Loading */

    loader.style.display = "block";
    button.disabled = true;
    button.innerText = "⏳ Searching...";


    try{

        const url =
            `${API_URL}?uid=${encodeURIComponent(uid)}&server=${encodeURIComponent(server)}`;

        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                `API returned ${response.status}`
            );
        }


        const result =
            await response.json();


        console.log("API RESPONSE:",result);


        /*
         * API response:
         *
         * {
         *   basicinfo: {
         *      accountid,
         *      nickname,
         *      region,
         *      level,
         *      rank,
         *      rankingpoints,
         *      liked,
         *      csrank,
         *      csrankingpoints
         *   }
         * }
         */


        const data =
            result.basicinfo ||
            result.basicInfo ||
            result.data?.basicinfo ||
            result.data?.basicInfo;


        if(!data){

            throw new Error(
                "Player data was not found in API response."
            );
        }


        /* Player name */

        document.getElementById("playerName")
            .innerText =
            data.nickname || "Unknown Player";


        /* UID */

        document.getElementById("playerUID")
            .innerText =
            "UID: " +
            (data.accountid || uid);


        /* Region */

        document.getElementById("playerRegion")
            .innerText =
            "Region: " +
            (data.region || server);


        /* Level */

        document.getElementById("level")
            .innerText =
            data.level ?? "-";


        /* BR Rank */

        document.getElementById("rank")
            .innerText =
            data.rank ?? "-";


        /* Likes */

        document.getElementById("likes")
            .innerText =
            formatNumber(data.liked);


        /* CS Rank */

        document.getElementById("csrank")
            .innerText =
            data.csrank ?? "-";


        /* BR Ranking Points */

        document.getElementById("brpoints")
            .innerText =
            formatNumber(data.rankingpoints);


        /* CS Ranking Points */

        document.getElementById("cspoints")
            .innerText =
            formatNumber(data.csrankingpoints);


        /* Show */

        profile.style.display = "block";


    }catch(error){

        console.error(error);

        showError(
            "Player information could not be loaded. " +
            "Check the UID/region or try again later."
        );

    }finally{

        loader.style.display = "none";

        button.disabled = false;

        button.innerText =
            "🔍 Search Player";
    }
}


/* Number formatter */

function formatNumber(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "-";
    }

    const number =
        Number(value);

    if(Number.isNaN(number)){

        return value;
    }

    return number.toLocaleString();
}


/* Error message */

function showError(message){

    const errorBox =
        document.getElementById("error");

    errorBox.innerText =
        "⚠️ " + message;

    errorBox.style.display =
        "block";
}


/* Enter key */

document
.getElementById("uid")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        searchPlayer();

    }

});

</script>

</body>
</html>
